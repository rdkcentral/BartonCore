#
# Makes Barton a client of ZigbeeCore's remote-zigbee container.  Layered by
# dockerw -T, after compose.remote-radios.yaml, when ZigbeeCore has been set up
# for remote radios (~/.remote-radios/zigbee.env exists).
#
# ZigbeeCore owns the per-user network <user>-remote-zigbee (created by its
# scripts/remote-zigbee.sh), where it is reachable as remote-zigbee.  Barton
# joins it under the alias zigbee-client, to which ZigbeeCore sends its events.
#

services:
    barton:
        networks:
            remote-zigbee:
                aliases:
                    - zigbee-client

networks:
    remote-zigbee:
        name: $BUILDER_USER-remote-zigbee
        external: true
