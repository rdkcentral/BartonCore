#
# Optional Docker Compose overlay that adds a container managing a developer's
# forwarded physical radios:
#
#   - cpcd        : CPC daemon (Silabs Zigbee/Thread serial <-> CPC socket)
#   - otbr-agent  : OpenThread Border Router agent (CPC socket <-> D-Bus API)
#   - bluetoothd  : BlueZ, managing a dedicated Bluetooth USB dongle attached
#                   over usb-ip, exposing org.bluez on a private D-Bus
#
# The two radios are independent physical devices forwarded from the
# developer's workstation:
#   - Silabs Zigbee/Thread radio : serial-over-SSH tunnel to a per-user UNIX
#     socket (bind-mounted here as SILABS_SOCKET).
#   - Bluetooth USB dongle       : usb-ip, attached inside this (privileged)
#     container — no host root required on the dev server.
#
# A named volume (dbus-socket) shares a private D-Bus socket directory between
# this container and the main barton/devcontainer.  This is not the host's
# /var/run/dbus; this container starts and owns its own private dbus-daemon.
#
# Running this overlay is OPTIONAL.  It is only layered in when a developer has
# forwarded radios (via scripts/remote-radios/remote-radios-setup.sh) and runs
# `./dockerw -T`.
#
# ─── Usage ───────────────────────────────────────────────────────────────────
#
#   On the workstation, once (no checkout needed):
#       curl -fsSL <raw>/scripts/remote-radios/remote-radios-setup.sh \
#         | bash -s -- <user>@<devserver>
#   Then, on the dev server:
#       ./dockerw -T bash
#
# ─── Environment variables ────────────────────────────────────────────────────
#
#   SILABS_SOCKET   Path (inside the container) of the bind-mounted UNIX socket
#                   for the Silabs serial tunnel.  Written to docker/.env by
#                   setupDockerEnv.sh from the developer's radio config.
#
#   SILABS_DEVICE   Host path of a locally-attached Silabs USB serial device
#                   (alternative to SILABS_SOCKET, for a radio on the dev
#                   server itself).
#
#   BT_USBIP_SOCKET Path (inside the container) of the bind-mounted UNIX socket
#                   that the workstation's usbipd is reverse-tunnelled to.  When
#                   set, the dongle is attached via usb-ip.  Optional.
#   BT_USBIP_TCP_PORT  Local TCP port socat listens on for usbip (default 3240).
#   BT_USBIP_BUSID  Remote busid to attach (default: auto-detect).
#
#   BACKBONE_IF     Thread backbone interface.  Default: host default-route
#                   interface detected by docker/setupDockerEnv.sh.
#
# ─────────────────────────────────────────────────────────────────────────────

services:
    remote-radios:
        build:
            context: .
            dockerfile: Dockerfile.remote-radios
        # privileged is required for:
        #   - creating the wpan0 network interface
        #   - configuring iptables rules for Thread border routing
        #   - loading vhci-hcd and attaching the Bluetooth dongle over usb-ip
        privileged: true
        # IPv6 forwarding must be enabled for otbr-agent to route packets
        # between the Docker bridge (eth0) and the Thread mesh (wpan0).
        # proxy_ndp allows otbr-agent to proxy Neighbor Discovery between
        # interfaces so Thread devices are reachable from the bridge.
        # NOTE: interface-specific sysctls (net.ipv6.conf.eth0.*) cannot be
        # set here — Docker requires them via driver options.  They are set
        # in the entrypoint instead since the container is privileged.
        sysctls:
            - net.ipv6.conf.all.forwarding=1
            - net.ipv6.conf.all.proxy_ndp=1
        # Connect to the same per-user IPv6 bridge network as the barton service so
        # that:
        #   - each user on a shared server gets an isolated wpan0 interface
        #   - NAT64/iptables rules are scoped to this container's network namespace
        #   - D-Bus communication with the barton container is via the
        #     dbus-socket volume, so no direct network path is required
        networks:
            - barton-ip6net
        volumes:
            # Share a private D-Bus socket directory with the barton/devcontainer
            # service so Barton code can talk to otbr-agent (and org.bluez) over
            # D-Bus without ever touching the host's system bus.
            - dbus-socket:/var/run/remote-radios-dbus
            # Bind-mount the developer's per-user Silabs serial tunnel socket
            # DIRECTORY (not the socket file).  remote-radios-setup.sh
            # (remote-serial.py) serves the socket inside this dir on the dev
            # server via `ssh -R`; socat in the entrypoint bridges it to a PTY
            # for cpcd.  Mounting the directory (rather than the socket file)
            # avoids Docker auto-creating a bogus directory in place of the
            # socket when the tunnel is not yet up.  The host dir is written to
            # docker/.env by setupDockerEnv.sh.
            - ${SILABS_SOCKET_DIR_HOST:-/run/remote-radios/radios}:${SILABS_SOCKET_DIR:-/run/remote-radios/radios}
            # Bind-mount the developer's per-user usb-ip socket DIRECTORY.  The
            # workstation reverse-tunnels its usbipd to a UNIX socket inside
            # this dir; socat in the entrypoint bridges it to a local TCP port
            # for `usbip attach` (avoids any sshd GatewayPorts change).
            - ${BT_USBIP_SOCKET_DIR_HOST:-/run/remote-radios/usbip}:${BT_USBIP_SOCKET_DIR:-/run/remote-radios/usbip}
            # Bind-mount the claim directory (read-only — this container only
            # observes claims, never writes them).  A consumer that cannot share
            # a radio drops a file here; see the RADIO_CLAIM_DIR comment in
            # remote-radios-entrypoint.sh.
            - ${RADIO_CLAIM_DIR_HOST:-/run/remote-radios/claims}:${RADIO_CLAIM_DIR:-/run/remote-radios/claims}:ro
            # /dev is needed so a locally-attached Silabs radio (SILABS_DEVICE)
            # and the usb-ip virtual devices are visible.  privileged: true
            # grants the necessary device access.
            - /dev:/dev
            # Bind-mount the host's network namespace so that bluetoothd (and
            # the usb-ip-created HCI device) live in the initial (host) netns.
            # AF_BLUETOOTH sockets are only available in the host netns.
            - /proc/1/ns/net:/run/host-netns:ro
            # Mount the host kernel modules (read-only) so the privileged
            # container can load vhci-hcd (usb-ip client) itself, without
            # requiring host root/sudo on the dev server.
            - /lib/modules:/lib/modules:ro
            # Bind-mount the entrypoint for development iteration without
            # rebuilding the Docker image.
            - ./remote-radios-entrypoint.sh:/entrypoint.sh:ro
        extra_hosts:
            # Allow the container to reach the workstation for the usb-ip
            # reverse tunnel (bluetooth dongle).
            - "host.docker.internal:host-gateway"
        environment:
            # Silabs radio: SILABS_SOCKET (remote tunnel, the usual case) or
            # SILABS_DEVICE (local radio on the dev server).  The entrypoint
            # validates and exits with a clear error if neither is usable.
            - SILABS_SOCKET=${SILABS_SOCKET:-/run/remote-radios/radios/silabs.sock}
            - SILABS_DEVICE=${SILABS_DEVICE:-}
            # Bluetooth dongle over usb-ip (optional — Thread works without it).
            - BT_USBIP_SOCKET=${BT_USBIP_SOCKET:-}
            - BT_USBIP_TCP_PORT=${BT_USBIP_TCP_PORT:-3240}
            - BT_USBIP_BUSID=${BT_USBIP_BUSID:-}
            - BACKBONE_IF=${BACKBONE_IF:-}
            # Where to look for radio claim files (see the entrypoint).
            - RADIO_CLAIM_DIR=${RADIO_CLAIM_DIR:-/run/remote-radios/claims}
            - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/var/run/remote-radios-dbus/system_bus_socket
            - CPC_INSTANCE=${CPC_INSTANCE:-cpcd_0}
        # Restart automatically if the stack crashes, but limit retries so a
        # missing/invalid radio does not cause an infinite restart loop and log
        # spam when this overlay is included without hardware.
        restart: on-failure:5

    # Add the shared private D-Bus socket volume to the barton service so
    # Barton can reach otbr-agent and org.bluez when explicitly requested,
    # without requiring any code changes.  By default Barton continues to use
    # the standard system bus so simulated/default flows keep working unless
    # the private socket is explicitly selected via DBUS_SYSTEM_BUS_ADDRESS.
    barton:
        volumes:
            - dbus-socket:/var/run/remote-radios-dbus
            # Expose the host network namespace so tools requiring AF_BLUETOOTH
            # (e.g. bluetoothctl) can run via nsenter.
            - /proc/1/ns/net:/run/host-netns:ro
        environment:
            - DBUS_SYSTEM_BUS_ADDRESS=${DBUS_SYSTEM_BUS_ADDRESS:-unix:path=/var/run/remote-radios-dbus/system_bus_socket}

networks:
    # Reuse the same per-user IPv6 bridge network defined in compose.yaml so
    # that remote-radios is properly segmented from the host network and each
    # user on a shared server gets their own isolated namespace.
    barton-ip6net:
        name: $BUILDER_USER-$BARTON_WORKSPACE_ID-barton-ip6net
        # Network is created by setupDockerEnv.sh and declared in compose.yaml
        external: true

volumes:
    # Per-user/workspace named volume that shares /var/run/remote-radios-dbus
    # between the remote-radios container (where the private dbus-daemon writes
    # its socket) and the devcontainer/barton container (where Barton connects).
    dbus-socket:
        name: $BUILDER_USER-$BARTON_WORKSPACE_ID-remote-radios-dbus-socket
