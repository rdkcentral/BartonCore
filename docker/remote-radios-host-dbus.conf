<!--
  Dev-server D-Bus policy for remote-radios.

  Every developer's remote-radios container runs its own otbr-agent and
  registers it on the dev server's system bus as
  io.openthread.BorderRouter.<interface>, where the interface is unique per
  developer (wpan<uid>). They share the system bus because org.bluez lives
  there, and Matter needs the border router and BlueZ on the same bus.

  Install once per dev server:
      sudo install -m 0644 docker/remote-radios-host-dbus.conf \
          /etc/dbus-1/system.d/remote-radios.conf
  dbus-daemon reloads system.d automatically.

  The grant is limited to the border-router names: otbr-agent (root inside
  each container) may own them, and any local user may call them.
-->
<busconfig>
    <policy user="root">
        <allow own_prefix="io.openthread.BorderRouter"/>
    </policy>
    <policy context="default">
        <allow send_destination_prefix="io.openthread.BorderRouter"/>
    </policy>
</busconfig>
