<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus D-Bus policy for the simulated OpenThread Border Router that runs
  inside the main barton image (scripts/start-simulated-otbr.sh).  Without this
  policy otbr-agent cannot own io.openthread.BorderRouter.wpan0 under the
  default-deny system policy and simulated Thread silently fails.

  NOTE: this is distinct from otbr-agent.conf, which is a private-bus daemon
  config consumed only by the real-radio image (Dockerfile.otbr-radio).
-->
<busconfig>
  <policy context="default">
    <allow own="io.openthread.BorderRouter.wpan0"/>
    <allow send_destination="io.openthread.BorderRouter.wpan0"/>
    <allow send_interface="*"/>
    <allow send_type="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
