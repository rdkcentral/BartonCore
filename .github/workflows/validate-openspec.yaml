# The goal of this workflow is to enforce that every OpenSpec spec conforms to
# the OpenSpec v4 structure by running `openspec validate --specs --strict`
# inside the builder image (which provides the pinned openspec CLI).

name: Validate OpenSpec Specs

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

# Minimal token scope: checkout (contents) and pulling the builder image from
# GHCR (packages). See docker/login-action below.
permissions:
    contents: read
    packages: read

jobs:
    get-action-constants:
        name: Get Action Constants
        uses: ./.github/workflows/action-constants.yaml
        secrets: inherit

    validate_openspec_specs:
        name: Validate OpenSpec Specs
        runs-on: ubuntu-latest
        needs: get-action-constants

        steps:
            -
                name: Checkout code
                uses: actions/checkout@v4
                with:
                    repository: ${{ github.repository }}
                    fetch-depth: 0
                    fetch-tags: true
            -
                name: Log in to GitHub Container Registry
                uses: docker/login-action@v2
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
            -
                name: Try to pull barton_builder Docker image
                continue-on-error: true
                run: |
                    if docker pull ${{ needs.get-action-constants.outputs.image_repo }}:${{ needs.get-action-constants.outputs.image_tag }}; then
                        echo "Image pulled successfully"
                    else
                        echo "Could not pull image, will build locally via dockerw"
                    fi
            -
                name: Validate specs (strict)
                run: ./dockerw -n openspec validate --specs --strict --no-interactive
